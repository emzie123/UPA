<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPA IT MASTER LOGBOOK V4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Minimal Header -->
    <header class="app-header">
      <div class="brand-tag-wrap">
        <span class="brand-badge">EQUIPMENT REGISTRATION FORM</span>
      </div>
      <h1 class="main-title">UPA IT MASTER LOGBOOK V4</h1>
      <p class="subtitle">Hardware &amp; Equipment Registration Portal</p>
    </header>

    <!-- Registration Form -->
    <main class="form-wrapper">
      <form id="masterLogbookForm" class="minimal-form" novalidate>
        
        <!-- Section 1: Transaction Information -->
        <div class="form-section">
          <div class="section-title-wrap">
            <span class="section-badge">01</span>
            <span class="section-label">Transaction Information</span>
          </div>
          
          <div class="form-grid grid-cols-2">
            <!-- Ticket Number -->
            <div class="field-group">
              <div class="field-header">
                <label for="ticketNumber">Ticket Number <span class="req-star">*</span></label>
                <span class="char-count" id="ticketCount">0/20</span>
              </div>
              <input 
                type="text" 
                id="ticketNumber" 
                class="form-input" 
                placeholder="e.g. TKT-2026-0814" 
                maxlength="20"
                required 
                autocomplete="off"
              />
            </div>

            <!-- Type of Transaction -->
            <div class="field-group">
              <div class="field-header">
                <label for="transactionType">Type of Transaction <span class="req-star">*</span></label>
              </div>
              <div class="autocomplete-wrap">
                <input 
                  type="text" 
                  id="transactionType" 
                  class="form-input" 
                  placeholder="Select or type transaction..." 
                  required 
                  autocomplete="off"
                />
                <div class="autocomplete-dropdown" id="transactionDropdown"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 2: Asset Specifications -->
        <div class="form-section">
          <div class="section-title-wrap">
            <span class="section-badge">02</span>
            <span class="section-label">Asset Specifications</span>
          </div>

          <div class="form-grid grid-cols-2">
            <!-- Type of Asset -->
            <div class="field-group">
              <div class="field-header">
                <label for="assetType">Type of Asset <span class="req-star">*</span></label>
              </div>
              <select id="assetType" class="form-select" required>
                <option value="Headset" selected>Headset</option>
                <option value="Laptop">Laptop</option>
                <option value="Desktop / CPU">Desktop / CPU</option>
                <option value="Monitor">Monitor</option>
                <option value="Peripherals">Peripherals</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Machine Name (Asset Model) -->
            <div class="field-group">
              <div class="field-header">
                <label for="assetModel">Machine Name (Asset Model) <span class="req-star">*</span></label>
              </div>
              <select id="assetModel" class="form-select" required>
                <!-- Populated dynamically based on Type of Asset -->
              </select>
            </div>
          </div>

          <div class="form-grid grid-cols-3 asset-secondary-grid">
            <!-- Serial Number -->
            <div class="field-group">
              <div class="field-header">
                <label for="serialNumber">Serial Number <span class="req-star">*</span></label>
                <span class="char-count" id="serialCount">0/25</span>
              </div>
              <input 
                type="text" 
                id="serialNumber" 
                class="form-input mono" 
                placeholder="Enter serial number" 
                maxlength="25"
                required 
                autocomplete="off"
              />
            </div>

            <!-- Quantity -->
            <div class="field-group">
              <div class="field-header">
                <label for="quantity">Quantity</label>
              </div>
              <input 
                type="text" 
                id="quantity" 
                class="form-input fixed-input" 
                value="1" 
                readonly 
                tabindex="-1"
                aria-label="Quantity"
              />
            </div>

            <!-- Asset Status -->
            <div class="field-group">
              <div class="field-header">
                <label for="assetStatus">Asset Status <span class="req-star">*</span></label>
              </div>
              <select id="assetStatus" class="form-select" required>
                <option value="" disabled selected>Select status...</option>
                <option value="Working / Deployed">Working / Deployed</option>
                <option value="In Stock / Available">In Stock / Available</option>
                <option value="Defective / For Repair">Defective / For Repair</option>
                <option value="Returned / Pending Inspection">Returned / Pending Inspection</option>
                <option value="Disposed / Scrapped">Disposed / Scrapped</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Section 3: Custodian Details -->
        <div class="form-section">
          <div class="section-title-wrap">
            <span class="section-badge">03</span>
            <span class="section-label">Custodian Details</span>
          </div>

          <div class="form-grid grid-cols-2">
            <!-- Account -->
            <div class="field-group">
              <div class="field-header">
                <label for="account">Account <span class="req-star">*</span></label>
              </div>
              <div class="autocomplete-wrap">
                <input 
                  type="text" 
                  id="account" 
                  class="form-input" 
                  placeholder="Select or type account..." 
                  required 
                  autocomplete="off"
                />
                <div class="autocomplete-dropdown" id="accountDropdown"></div>
              </div>
            </div>

            <!-- Name -->
            <div class="field-group">
              <div class="field-header">
                <label for="fullName">Name <span class="req-star">*</span></label>
              </div>
              <input 
                type="text" 
                id="fullName" 
                class="form-input" 
                placeholder="Last Name, First Name M.I." 
                required 
                autocomplete="off"
              />
            </div>

            <!-- Workday ID -->
            <div class="field-group">
              <div class="field-header">
                <label for="workdayId">Workday ID <span class="req-star">*</span></label>
                <span class="char-count" id="workdayCount">0/12</span>
              </div>
              <input 
                type="text" 
                id="workdayId" 
                class="form-input mono" 
                placeholder="Enter Workday ID" 
                maxlength="12"
                required 
                autocomplete="off"
              />
            </div>

            <!-- Concentrix Email / Personal (if resign) -->
            <div class="field-group">
              <div class="field-header">
                <label for="emailAddress">Concentrix Email / Personal (if resign) <span class="req-star">*</span></label>
              </div>
              <input 
                type="email" 
                id="emailAddress" 
                class="form-input" 
                placeholder="employee@concentrix.com or personal email" 
                required 
                autocomplete="off"
              />
            </div>
          </div>

          <!-- Remarks -->
          <div class="field-group remarks-group">
            <div class="field-header">
              <label for="remarks">Remarks <span class="opt-tag">(Optional)</span></label>
            </div>
            <textarea 
              id="remarks" 
              class="form-textarea" 
              rows="3" 
              placeholder="Additional notes or specifications..."
            ></textarea>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="form-footer">
          <button type="button" class="btn-ghost" id="resetBtn">Reset</button>
          <button type="submit" class="btn-solid" id="submitBtn">Submit</button>
        </div>
      </form>
    </main>

  </div>

  <!-- Submission Receipt Modal -->
  <div class="modal-overlay" id="receiptModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-top">
        <div class="modal-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h3 class="modal-heading">Registration Submitted</h3>
          <p class="modal-desc">Your transaction has been recorded successfully.</p>
        </div>
      </div>

      <div class="modal-details-grid" id="modalDetails"></div>

      <div class="modal-footer">
        <button type="button" class="btn-solid w-full" id="closeModalBtn">Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
